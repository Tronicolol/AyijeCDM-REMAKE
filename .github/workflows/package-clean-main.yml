name: Package clean main

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    if: contains(github.event.head_commit.message, '[package-clean-main]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate diagnostic cleanup
        shell: bash
        run: |
          set -euo pipefail
          test ! -e KCDM/Modules/GlowLifecycleDebug.lua
          ! grep -R -n -E 'GlowLifecycleTrace|DebugTrace\(|KCDMGLOWDIAG|GLOW-DIAG|kcdmglowdiag' KCDM KCDM_Options
          ! grep -n 'GlowLifecycleDebug.lua' KCDM/Modules/embeds.xml
          grep -q 'GEOMETRY_SETTLE_DELAY' KCDM/Modules/GlowController.lua
          grep -q 'QueueStableGeometryRefresh' KCDM/Modules/GlowController.lua
          grep -q 'RequestMatches' KCDM/Modules/GlowController.lua
          grep -q 'local winnerToken = SelectWinner' KCDM/Modules/GlowController.lua

      - name: Validate Lua and XML
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)
          PY

      - name: Build complete addon package
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options
          test -f package/KCDM/KCDM.toc
          test -f package/KCDM_Options/KCDM_Options.toc
          roots="$(find package -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')"
          test "$roots" = "KCDM KCDM_Options "

      - uses: actions/upload-artifact@v4
        with:
          name: KCDM-main-clean
          path: package/
          if-no-files-found: error
          retention-days: 7
