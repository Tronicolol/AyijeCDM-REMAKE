name: Final branch cleanup

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arreglos-visuales
          fetch-depth: 0

      - name: Integrate final menu changes
        shell: python
        run: |
          from pathlib import Path

          config = Path('KCDM_Options/ConfigFrame.lua')
          text = config.read_text(encoding='utf-8')
          old = '{ label = L["Features"], tabs = {"racials", "resources", "defensives", "trinkets", "castbar"} },'
          new = '{ label = L["Features"], tabs = {"defensives", "racials", "resources", "trinkets", "castbar"} },'
          if text.count(old) != 1:
              raise SystemExit('Unexpected ConfigFrame Features menu pattern')
          config.write_text(text.replace(old, new), encoding='utf-8')

          racials = Path('KCDM_Options/Racials.lua')
          text = racials.read_text(encoding='utf-8')
          old_checkbox = '        L["Enable Racials"],'
          new_checkbox = '        "Enable Items",'
          if text.count(old_checkbox) != 1:
              raise SystemExit('Unexpected Enable Racials pattern')
          text = text.replace(old_checkbox, new_checkbox)
          old_tab = 'API:RegisterConfigTab("racials", L["Racials"], CreateRacialsTab, 9)'
          new_tab = 'API:RegisterConfigTab("racials", "Items", CreateRacialsTab, 9)'
          if text.count(old_tab) != 1:
              raise SystemExit('Unexpected Racials tab registration pattern')
          racials.write_text(text.replace(old_tab, new_tab), encoding='utf-8')

          embeds = Path('KCDM_Options/embeds.xml')
          text = embeds.read_text(encoding='utf-8')
          marker = '    <Script file="FeatureMenuOrder.lua"/>\n'
          if text.count(marker) != 1:
              raise SystemExit('Unexpected FeatureMenuOrder embeds pattern')
          embeds.write_text(text.replace(marker, ''), encoding='utf-8')

          helper = Path('KCDM_Options/FeatureMenuOrder.lua')
          if not helper.exists():
              raise SystemExit('FeatureMenuOrder.lua missing before cleanup')
          helper.unlink()

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate Lua syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
          done < <(find KCDM KCDM_Options -type f -name '*.lua' -print0)

      - name: Validate XML and referenced scripts
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for xml_path in list(Path('KCDM').rglob('*.xml')) + list(Path('KCDM_Options').rglob('*.xml')):
              root = ET.parse(xml_path).getroot()
              for node in root.iter():
                  if node.tag.endswith('Script'):
                      rel = node.attrib.get('file')
                      if rel:
                          target = xml_path.parent / rel.replace('\\', '/')
                          if not target.exists():
                              raise SystemExit(f'Missing script target: {xml_path} -> {rel}')

      - name: Validate removals and retained functionality
        shell: python
        run: |
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          options_embeds = read('KCDM_Options/embeds.xml')
          modules_embeds = read('KCDM/Modules/embeds.xml')
          bars = read('KCDM_Options/Bars.lua')
          buffs = read('KCDM_Options/BuffGroups.lua')
          racials_opts = read('KCDM_Options/Racials.lua')
          racials_runtime = read('KCDM/Modules/Racials.lua')
          migration = read('KCDM/Modules/RacialsPartyAnchorMigration.lua')
          config_frame = read('KCDM_Options/ConfigFrame.lua')

          checks_absent = {
              'FeatureMenuOrder load ref': 'FeatureMenuOrder.lua' in options_embeds,
              'Externals options load ref': 'Externals.lua' in options_embeds,
              'Externals runtime load ref': 'Externals.lua' in modules_embeds,
              'Bars Add Spell button': 'Add Spell' in bars,
              'Buff Groups Add Icon button': 'Add Icon' in buffs,
              'Racials party anchor option': 'Anchor to Party Frame' in racials_opts,
              'Racials runtime party anchor function': 'AnchorRacialsToPartyFrame' in racials_runtime,
          }
          failures = [name for name, present in checks_absent.items() if present]
          if failures:
              raise SystemExit('Unexpected leftovers: ' + ', '.join(failures))

          if 'Add Custom Buff' not in buffs:
              raise SystemExit('Buff Groups Add Custom Buff was lost')
          if 'RacialsPartyAnchorMigration.lua' not in modules_embeds:
              raise SystemExit('Racials migration is not loaded')
          if 'racialsUsePartyFrame' not in migration:
              raise SystemExit('Racials migration no longer clears legacy party anchor data')
          expected_menu = '{ label = L["Features"], tabs = {"defensives", "racials", "resources", "trinkets", "castbar"} },'
          if expected_menu not in config_frame:
              raise SystemExit('Feature menu order is incorrect')
          if '"Enable Items"' not in racials_opts:
              raise SystemExit('Enable Items label missing')
          if 'API:RegisterConfigTab("racials", "Items", CreateRacialsTab, 9)' not in racials_opts:
              raise SystemExit('Items tab label missing')

      - name: Validate no temporary helper files
        run: |
          set -euo pipefail
          test ! -e KCDM_Options/FeatureMenuOrder.lua
          test ! -e KCDM_Options/RemovedControls.lua
          ! find KCDM KCDM_Options -type f \( -iname '*tmp*' -o -iname '*testpatch*' -o -iname '*removedcontrols*' \) | grep -q .

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "Tronicolol"
          git config user.email "54152736+Tronicolol@users.noreply.github.com"
          git add -A KCDM_Options
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "Integrate final feature menu cleanup [skip ci]"
          git push origin HEAD:arreglos-visuales
