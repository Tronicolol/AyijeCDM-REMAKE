name: Package original button glow diagnostic

on:
  push:
    branches:
      - diagnostic-glow-lifecycle-2026-09-23

permissions:
  contents: read

jobs:
  package:
    if: contains(github.event.head_commit.message, '[package-original-button-glow-diag]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate Lua and XML
        shell: bash
        run: |
          set -euo pipefail
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)
          PY

      - name: Validate diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GlowLifecycleDebug.lua' KCDM/Modules/embeds.xml
          grep -q 'LCG_BUTTON_START_ALL' KCDM/Modules/GlowLifecycleDebug.lua
          grep -q 'LCG_BUTTON_STOP_ALL' KCDM/Modules/GlowLifecycleDebug.lua
          grep -q 'BUTTON_STATE_CHANGE' KCDM/Modules/GlowLifecycleDebug.lua
          grep -q 'LCG.ButtonGlow_Start' KCDM/Modules/GlowController.lua
          grep -q 'LCG.ButtonGlow_Stop' KCDM/Modules/GlowController.lua
          ! grep -q 'StartOrUpdateStableButtonGlow' KCDM/Modules/GlowController.lua

      - name: Build complete diagnostic package
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options
          test -f package/KCDM/KCDM.toc
          test -f package/KCDM_Options/KCDM_Options.toc
          roots="$(find package -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')"
          test "$roots" = "KCDM KCDM_Options "

      - uses: actions/upload-artifact@v4
        with:
          name: KCDM-original-button-glow-diagnostic
          path: package/
          if-no-files-found: error
          retention-days: 7
