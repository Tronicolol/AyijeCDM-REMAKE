name: Temporary source cleanup

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arreglos-visuales

      - name: Apply source cleanup
        run: python3 .github/cleanup_source.py

      - name: Validate source cleanup
        shell: bash
        run: |
          git diff --check
          ! grep -R "Add Icon" KCDM_Options/BuffGroups.lua
          ! grep -R "Add Spell" KCDM_Options/Bars.lua
          ! grep -R "racialsUsePartyFrame\|racialsPartyFrame\|racialsRaidFrame" KCDM/Modules/Racials.lua KCDM_Options/Racials.lua KCDM/Config/Defaults.lua KCDM_Options/ConfigKeys.lua
          grep -q 'RacialsPartyAnchorMigration.lua' KCDM/Modules/embeds.xml
          grep -q 'Add Custom Buff' KCDM_Options/BuffGroups.lua
          test ! -e KCDM_Options/RemovedControls.lua

      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A KCDM KCDM_Options
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Remove redundant pickers and Racials party anchoring"
          git push origin HEAD:arreglos-visuales
