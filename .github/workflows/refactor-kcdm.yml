name: One-shot KCDM refactor

on:
  push:
    branches:
      - refactor-kcdm

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor addon identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, re

          root = Path('.')
          old_main = root / 'Ayije_CDM'
          old_options = root / 'Ayije_CDM_Options'
          new_main = root / 'KCDM'
          new_options = root / 'KCDM_Options'

          if new_main.exists():
              shutil.rmtree(new_main)
          if new_options.exists():
              shutil.rmtree(new_options)

          shutil.move(str(old_main), str(new_main))
          shutil.move(str(old_options), str(new_options))

          (new_main / 'Ayije_CDM.toc').rename(new_main / 'KCDM.toc')
          (new_options / 'Ayije_CDM_Options.toc').rename(new_options / 'KCDM_Options.toc')

          borders = new_main / 'Media' / 'Borders'
          for old, new in [('Ayije_Thin.tga', 'KCDM_Thin.tga'), ('Ayije_Empty.tga', 'KCDM_Empty.tga')]:
              p = borders / old
              if p.exists():
                  p.rename(p.with_name(new))

          for name in ['Discord.tga', 'Twitch.tga']:
              p = new_main / 'Media' / 'Textures' / name
              if p.exists():
                  p.unlink()

          text_ext = {'.lua', '.xml', '.toc', '.md', '.txt', '.json'}
          for base in [new_main, new_options]:
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in text_ext:
                      continue
                  if 'Libs' in p.parts or p.name == 'LICENSE':
                      continue
                  raw = p.read_text(encoding='utf-8-sig')
                  raw = raw.replace('AYIJE_CDM', 'KCDM')
                  raw = raw.replace('Ayije_CDM', 'KCDM')
                  raw = raw.replace('AyijeCDM', 'KCDM')
                  raw = raw.replace('Ayije CDM', 'KCDM')
                  raw = raw.replace('Ayije_', 'KCDM_')
                  raw = raw.replace('Ayije', 'KCDM')
                  raw = raw.replace('/acdmdiag', '/kcdmdiag')
                  raw = raw.replace('/acdm', '/kcdm')
                  raw = raw.replace('SLASH_ACDM', 'SLASH_KCDM')
                  raw = raw.replace('ACDM', 'KCDM')
                  p.write_text(raw, encoding='utf-8')

          toc = new_main / 'KCDM.toc'
          s = toc.read_text(encoding='utf-8')
          s = re.sub(r'^## Author:.*\n?', '', s, flags=re.M)
          s = s.replace('## SavedVariables: KCDMDB', '## SavedVariables: KCDMDB\n## OptionalDeps: Ayije_CDM')
          toc.write_text(s, encoding='utf-8')

          toc = new_options / 'KCDM_Options.toc'
          s = toc.read_text(encoding='utf-8')
          s = re.sub(r'^## Author:.*\n?', '', s, flags=re.M)
          toc.write_text(s, encoding='utf-8')

          init = new_main / 'Init.lua'
          s = init.read_text(encoding='utf-8')
          needle = 'local AddonName = "KCDM"\n'
          migration = '''local AddonName = "KCDM"\n\n-- Temporary one-time compatibility for the KCDM rename.\n-- KCDMDB always wins once it exists.\nif KCDMDB == nil and _G.Ayije_CDMDB ~= nil then\n    KCDMDB = _G.Ayije_CDMDB\nend\n'''
          if not s.startswith(needle):
              raise RuntimeError('Unexpected KCDM/Init.lua header')
          s = migration + s[len(needle):]
          init.write_text(s, encoding='utf-8')

          cf = new_options / 'ConfigFrame.lua'
          s = cf.read_text(encoding='utf-8')
          start = s.find('    local discordBtn\n')
          end = s.find('    versionText = ConfigFrame:CreateFontString', start)
          if start == -1 or end == -1:
              raise RuntimeError('Could not locate legacy social footer block')
          s = s[:start] + s[end:]
          s = s.replace('local discordText = nil\n', '')
          s = s.replace('local twitchText = nil\n', '')
          s = s.replace('    ApplyFooterTextStyle(discordText)\n', '')
          s = s.replace('    ApplyFooterTextStyle(twitchText)\n', '')
          s = s.replace('        discordText = nil\n', '')
          s = s.replace('        twitchText = nil\n', '')
          cf.write_text(s, encoding='utf-8')

          (new_main / 'NOTICE').write_text(
              'KCDM\n\nThis project contains modified code derived from prior software.\n'
              'The original copyright notice and terms are preserved in LICENSE.\n',
              encoding='utf-8'
          )

          # Only the original LICENSE and temporary migration bridge may retain the legacy name.
          leftovers = []
          for base in [new_main, new_options]:
              for p in base.rglob('*'):
                  if not p.is_file() or 'Libs' in p.parts or p.name == 'LICENSE':
                      continue
                  if p.suffix.lower() not in text_ext:
                      continue
                  txt = p.read_text(encoding='utf-8-sig')
                  if 'Ayije' in txt:
                      allowed = p == new_main / 'Init.lua' or p == new_main / 'KCDM.toc'
                      if not allowed:
                          leftovers.append(str(p))
          if leftovers:
              raise RuntimeError('Unexpected legacy identity references: ' + ', '.join(leftovers))
          PY

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor addon identity to KCDM"
          git push origin HEAD:refactor-kcdm
