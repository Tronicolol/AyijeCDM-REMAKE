name: Validate spec glow transition fix

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arreglos-visuales
          fetch-depth: 0

      - name: Apply spec transition glow fix
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          glow = 'KCDM/Modules/GlowController.lua'

          replace_once(
              glow,
              '''local originalRefreshActiveGlows = Glow.RefreshActiveGlows\nlocal lastVisualConfigVersion = Glow.visualConfigVersion or 0\n''',
              '''local originalRefreshActiveGlows = Glow.RefreshActiveGlows\nlocal lastVisualConfigVersion = Glow.visualConfigVersion or 0\nlocal specTransitionSuspended = false\nlocal specTransitionGeneration = 0\nlocal resetSnapshot = {}\n''',
              'glow transition state'
          )

          replace_once(
              glow,
              '''local function ResetPrimary(frame)\n    states[frame] = nil\n    ClearCompat(frame)\n    local host = frame.cdmBuffGlowHost\n    if host then HardStopHost(host) end\nend\n\nlocal function ScheduleStop(frame, state)\n''',
              '''local function ResetPrimary(frame)\n    states[frame] = nil\n    ClearCompat(frame)\n    local host = frame.cdmBuffGlowHost\n    if host then HardStopHost(host) end\nend\n\nlocal function ResetAllPrimaryGlows()\n    local count = 0\n    for frame in pairs(states) do\n        count = count + 1\n        resetSnapshot[count] = frame\n    end\n\n    for i = 1, count do\n        local frame = resetSnapshot[i]\n        resetSnapshot[i] = nil\n        if frame then\n            ResetPrimary(frame)\n        end\n    end\n\n    if CDM.ForEachActiveFrame then\n        CDM:ForEachActiveFrame({ VIEWERS.ESSENTIAL, VIEWERS.UTILITY }, function(frame)\n            ClearCompat(frame)\n            local host = frame.cdmBuffGlowHost\n            if host then\n                HardStopHost(host)\n            end\n        end)\n    end\nend\n\nfunction Glow:BeginSpecTransition()\n    specTransitionGeneration = specTransitionGeneration + 1\n    specTransitionSuspended = true\n    ResetAllPrimaryGlows()\nend\n\nfunction Glow:EndSpecTransition()\n    if not specTransitionSuspended then return end\n\n    -- Blizzard recycles/reparents cooldown frames while specialization data is\n    -- rebuilding. Purge again before re-enabling requests so no transient host\n    -- geometry survives into the settled specialization.\n    ResetAllPrimaryGlows()\n\n    local generation = specTransitionGeneration\n    C_Timer.After(0, function()\n        if not specTransitionSuspended then return end\n        if specTransitionGeneration ~= generation then return end\n\n        specTransitionSuspended = false\n        if CDM.Refresh then\n            CDM:Refresh()\n        elseif CDM.GlowDirector and CDM.GlowDirector.RebuildIndex then\n            CDM.GlowDirector:RebuildIndex()\n        end\n    end)\nend\n\nlocal function ScheduleStop(frame, state)\n''',
              'global glow reset around spec change'
          )

          replace_once(
              glow,
              '''Glow.RequestBuffGlow = function(self, frame, producerToken, enabled, overrideColor, sourceID)\n    if not frame or not VALID_PRODUCERS[producerToken] then return end\n''',
              '''Glow.RequestBuffGlow = function(self, frame, producerToken, enabled, overrideColor, sourceID)\n    if not frame or not VALID_PRODUCERS[producerToken] then return end\n    if specTransitionSuspended then\n        ClearCompat(frame)\n        local host = frame.cdmBuffGlowHost\n        if host then HardStopHost(host) end\n        states[frame] = nil\n        return\n    end\n''',
              'ignore glow requests during spec transition'
          )

          replace_once(
              glow,
              '''Glow.InstallAcquireResetHook = function(self, viewer)\n    hooksecurefunc(viewer, "OnAcquireItemFrame", function(_, itemFrame)\n        local state = states[itemFrame]\n        if not state then\n            local host = itemFrame.cdmBuffGlowHost\n            if host and host.cdmGlowActive then HardStopHost(host) end\n            return\n        end\n''',
              '''Glow.InstallAcquireResetHook = function(self, viewer)\n    hooksecurefunc(viewer, "OnAcquireItemFrame", function(_, itemFrame)\n        local state = states[itemFrame]\n        if specTransitionSuspended then\n            if state then\n                ResetPrimary(itemFrame)\n            else\n                ClearCompat(itemFrame)\n                local host = itemFrame.cdmBuffGlowHost\n                if host then HardStopHost(host) end\n            end\n            return\n        end\n        if not state then\n            ClearCompat(itemFrame)\n            local host = itemFrame.cdmBuffGlowHost\n            if host then HardStopHost(host) end\n            return\n        end\n''',
              'acquire orphan glow purge'
          )

          replace_once(
              glow,
              '''Glow.RefreshActiveGlows = function(self, forceUpdate)\n    local version = self.visualConfigVersion or 0\n''',
              '''Glow.RefreshActiveGlows = function(self, forceUpdate)\n    if specTransitionSuspended then return end\n    local version = self.visualConfigVersion or 0\n''',
              'suspend active glow refreshes'
          )

          replace_once(
              glow,
              '''Glow.RefreshSpellGlowTypeOverrides = function(self)\n    for frame in pairs(states) do RefreshFrame(frame, false) end\nend\n''',
              '''Glow.RefreshSpellGlowTypeOverrides = function(self)\n    if specTransitionSuspended then return end\n    for frame in pairs(states) do RefreshFrame(frame, false) end\nend\n''',
              'suspend per-spell glow refreshes'
          )

          spec = 'KCDM/Core/SpecChange.lua'

          replace_once(
              spec,
              '''    local ProcessSpecChange\n\n    local processingInProgress = false\n''',
              '''    local ProcessSpecChange\n\n    local function BeginGlowSpecTransition()\n        if self.Glow and self.Glow.BeginSpecTransition then\n            self.Glow:BeginSpecTransition()\n        end\n    end\n\n    local processingInProgress = false\n''',
              'spec transition begin helper'
          )

          replace_once(
              spec,
              '''            if self.UpdatePlayerCastBar then self:UpdatePlayerCastBar() end\n        end)\n''',
              '''            if self.UpdatePlayerCastBar then self:UpdatePlayerCastBar() end\n            if self.Glow and self.Glow.EndSpecTransition then\n                self.Glow:EndSpecTransition()\n            end\n        end)\n''',
              'spec transition end'
          )

          replace_once(
              spec,
              '''            if isFullChange then\n                isFullSpecChange = true\n                self.pendingSpecChange = true\n                self:InvalidateSpecIDCache()\n            end\n''',
              '''            if isFullChange then\n                isFullSpecChange = true\n                self.pendingSpecChange = true\n                self:InvalidateSpecIDCache()\n                BeginGlowSpecTransition()\n            end\n''',
              'deferred full spec transition begin'
          )

          replace_once(
              spec,
              '''        if event == "ACTIVE_TALENT_GROUP_CHANGED" then\n            isFullSpecChange = true\n            self.pendingSpecChange = true\n            self:InvalidateSpecIDCache()\n        end\n''',
              '''        if event == "ACTIVE_TALENT_GROUP_CHANGED" then\n            isFullSpecChange = true\n            self.pendingSpecChange = true\n            self:InvalidateSpecIDCache()\n            BeginGlowSpecTransition()\n        end\n''',
              'talent group spec transition begin'
          )

          replace_once(
              spec,
              '''        self.pendingTalentChange = true\n        isFullSpecChange = true\n        self.pendingSpecChange = true\n        self:InvalidateSpecIDCache()\n        ScheduleBackstop()\n''',
              '''        self.pendingTalentChange = true\n        isFullSpecChange = true\n        self.pendingSpecChange = true\n        self:InvalidateSpecIDCache()\n        BeginGlowSpecTransition()\n        ScheduleBackstop()\n''',
              'player specialization transition begin'
          )

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate complete addon
        run: |
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          git diff --check

      - name: Validate XML and transition invariants
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)

          controller = Path('KCDM/Modules/GlowController.lua').read_text(encoding='utf-8')
          spec = Path('KCDM/Core/SpecChange.lua').read_text(encoding='utf-8')
          required_controller = [
              'function Glow:BeginSpecTransition()',
              'function Glow:EndSpecTransition()',
              'if specTransitionSuspended then',
              'ResetAllPrimaryGlows()',
              'if host then HardStopHost(host) end',
          ]
          required_spec = [
              'BeginGlowSpecTransition()',
              'self.Glow:EndSpecTransition()',
          ]
          for token in required_controller:
              assert token in controller, token
          for token in required_spec:
              assert token in spec, token

      - name: Commit bugfix
        run: |
          git config user.name 'Tronicolol'
          git config user.email '54152736+Tronicolol@users.noreply.github.com'
          git add KCDM/Modules/GlowController.lua KCDM/Core/SpecChange.lua
          git commit -m 'Fix glow corruption across spec changes [skip ci]'
          git push origin HEAD:arreglos-visuales

      - name: Build complete KCDM
        run: |
          mkdir package
          cp -a KCDM package/KCDM

      - uses: actions/upload-artifact@v4
        with:
          name: Ayije-Spec-Glow-Bugfix
          path: package/
          if-no-files-found: error
