name: Validate pandemic glow debounce

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[validate-pandemic-glow-debounce]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate Lua and XML
        shell: bash
        run: |
          set -euo pipefail
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)
          PY

      - name: Validate pandemic debounce and glow references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'local PANDEMIC_HIDE_DELAY = 0.10' KCDM/Core/Glow.lua
          grep -q 'C_Timer.After(PANDEMIC_HIDE_DELAY' KCDM/Core/Glow.lua
          grep -q 'HidePandemicGlow(frame, immediate)' KCDM/Core/Glow.lua
          grep -q 'HidePandemicGlow(frame, true)' KCDM/Modules/GlowController.lua
          grep -q 'HidePandemicGlow(itemFrame, true)' KCDM/Core/Style.lua

          refs="$(grep -R -n -E 'ButtonGlow_(Start|Stop)' KCDM KCDM_Options --include='*.lua' | grep -v 'KCDM/Libs/LibCustomGlow-1.0/LibCustomGlow-1.0.lua' || true)"
          printf '%s\n' "$refs"
          count="$(printf '%s\n' "$refs" | sed '/^$/d' | wc -l)"
          test "$count" -eq 4
          printf '%s\n' "$refs" | grep -q '^KCDM/Core/Glow.lua:'
          printf '%s\n' "$refs" | grep -q '^KCDM/Modules/GlowController.lua:'
          unexpected="$(printf '%s\n' "$refs" | grep -v -E '^(KCDM/Core/Glow.lua|KCDM/Modules/GlowController.lua):' || true)"
          test -z "$unexpected"

          test ! -e KCDM/Modules/GlowLifecycleDebug.lua
          ! grep -R -n -E 'GlowLifecycleTrace|KCDMGLOWDIAG|LCG_BUTTON_START_ALL|BUTTON_STATE_CHANGE' KCDM KCDM_Options

      - name: Build complete package
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options
          test -f package/KCDM/KCDM.toc
          test -f package/KCDM_Options/KCDM_Options.toc
          roots="$(find package -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')"
          test "$roots" = "KCDM KCDM_Options "

      - uses: actions/upload-artifact@v4
        with:
          name: KCDM-main-pandemic-glow-debounce
          path: package/
          if-no-files-found: error
          retention-days: 7
