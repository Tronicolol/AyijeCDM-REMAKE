name: Validate grouped buff cooldown text

on:
  push:
    branches:
      - fix-buff-active-cooldown-text

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[validate-buff-cooldown-text]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate Lua and XML
        shell: bash
        run: |
          set -euo pipefail
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)
          PY

      - name: Validate localized fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function CDM:ReapplyGroupedBuffCooldownText(frame)' KCDM/Modules/BuffGroups.lua
          grep -q 'CDM:ReapplyGroupedBuffCooldownText(frame)' KCDM/Core/Style.lua
          grep -q 'cdmBuffCooldownTextRefreshPending' KCDM/Core/Style.lua
          grep -q 'OverrideCooldownText(cd.Text or cd.text' KCDM/Modules/BuffGroups.lua
          grep -q 'cd:GetRegions()' KCDM/Modules/BuffGroups.lua

          test ! -e KCDM/Modules/GlowLifecycleDebug.lua
          ! grep -R -n -E 'GlowLifecycleTrace|KCDMGLOWDIAG' KCDM KCDM_Options

      - name: Build complete package
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options
          test -f package/KCDM/KCDM.toc
          test -f package/KCDM_Options/KCDM_Options.toc
          roots="$(find package -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')"
          test "$roots" = "KCDM KCDM_Options "

      - uses: actions/upload-artifact@v4
        with:
          name: KCDM-buff-cooldown-text-fix
          path: package/
          if-no-files-found: error
          retention-days: 7
