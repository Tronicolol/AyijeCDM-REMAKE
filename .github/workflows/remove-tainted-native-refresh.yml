name: Remove tainted native refresh

on:
  push:
    branches:
      - fix-trinket-aura-overlay-glow

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-trinket-aura-overlay-glow
          fetch-depth: 0

      - name: Remove unsafe Blizzard RefreshData call
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('KCDM/Core/Style.lua')
          text = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r'\nlocal function QueueEquippedItemNativeRefresh\(frame\)\n.*?\nend\n\nlocal function ApplyPandemicCDMStyle',
              re.S,
          )
          text, count = pattern.subn('\nlocal function ApplyPandemicCDMStyle', text, count=1)
          if count != 1:
              raise SystemExit(f'unsafe helper removal count={count}')

          pattern = re.compile(
              r'(\n    if isEquippedItem and entry and entry\.auraOverlay then)\n'
              r'        if frame\.cdmEquippedItemNativeOverlay ~= true then\n'
              r'            frame\.cdmEquippedItemNativeOverlay = true\n'
              r'            QueueEquippedItemNativeRefresh\(frame\)\n'
              r'        end\n'
          )
          text, count = pattern.subn(r'\1\n', text, count=1)
          if count != 1:
              raise SystemExit(f'unsafe overlay trigger removal count={count}')

          cleanup = '    elseif isEquippedItem then\n        frame.cdmEquippedItemNativeOverlay = nil\n'
          if text.count(cleanup) != 1:
              raise SystemExit(f'overlay cleanup count={text.count(cleanup)}')
          text = text.replace(cleanup, '', 1)

          reset_overlay = '        itemFrame.cdmEquippedItemNativeOverlay = nil\n'
          reset_pending = '        itemFrame.cdmEquippedItemNativeRefreshPending = nil\n'
          if text.count(reset_overlay) != 1 or text.count(reset_pending) != 1:
              raise SystemExit('native refresh reset fields not found exactly once')
          text = text.replace(reset_overlay, '', 1)
          text = text.replace(reset_pending, '', 1)

          p.write_text(text, encoding='utf-8')

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate taint fix
        run: |
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)

          style = Path('KCDM/Core/Style.lua').read_text(encoding='utf-8')
          assert 'QueueEquippedItemNativeRefresh' not in style
          assert 'pcall(frame.RefreshData, frame)' not in style
          assert 'cdmEquippedItemNativeOverlay' not in style
          assert 'cdmEquippedItemNativeRefreshPending' not in style
          assert 'hooksecurefunc(frame, "RefreshData", function(self)' in style
          assert 'return CDM:ResolveAuraOverlayEntryForFrame(frame)' in style

          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == {'KCDM/Core/Style.lua'}, changed
          PY

      - name: Commit taint fix
        run: |
          git config user.name 'Tronicolol'
          git config user.email '54152736+Tronicolol@users.noreply.github.com'
          git add KCDM/Core/Style.lua
          git commit -m 'Stop forcing Blizzard RefreshData from KCDM [skip ci]'
          git push origin HEAD:fix-trinket-aura-overlay-glow

      - name: Build complete addon package
        run: |
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options

      - name: Verify package roots
        shell: python
        run: |
          from pathlib import Path
          roots = sorted(p.name for p in Path('package').iterdir())
          assert roots == ['KCDM', 'KCDM_Options'], roots
          assert Path('package/KCDM/KCDM.toc').is_file()
          assert Path('package/KCDM_Options/KCDM_Options.toc').is_file()

      - uses: actions/upload-artifact@v4
        with:
          name: KCDM-Taint-Safe-Aura-Glow-Fix
          path: package/
          if-no-files-found: error
