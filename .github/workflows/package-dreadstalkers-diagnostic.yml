name: Package Dreadstalkers diagnostic

on:
  push:
    branches:
      - fix-trinket-aura-overlay-glow

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-trinket-aura-overlay-glow
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate diagnostic-only diff
        run: |
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          git diff --check origin/main...HEAD
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)

          files = set(subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines())
          files.discard('.github/workflows/package-dreadstalkers-diagnostic.yml')
          expected = {
              'KCDM/Modules/DreadstalkersAuraDebug.lua',
              'KCDM/Modules/embeds.xml',
          }
          assert files == expected, (files, expected)

          debug = Path('KCDM/Modules/DreadstalkersAuraDebug.lua').read_text(encoding='utf-8')
          assert 'RefreshData' not in debug
          assert 'auraInstanceIDToItemFramesMap' not in debug
          assert 'SLASH_KCDMDREAD1 = "/kcdmdread"' in debug
          PY

      - name: Build complete addon package
        run: |
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options

      - name: Verify package roots
        shell: python
        run: |
          from pathlib import Path
          roots = sorted(p.name for p in Path('package').iterdir())
          assert roots == ['KCDM', 'KCDM_Options'], roots
          assert Path('package/KCDM/KCDM.toc').is_file()
          assert Path('package/KCDM_Options/KCDM_Options.toc').is_file()
          assert Path('package/KCDM/Modules/DreadstalkersAuraDebug.lua').is_file()

      - uses: actions/upload-artifact@v4
        with:
          name: KCDM-Dreadstalkers-Aura-Diagnostic
          path: package/
          if-no-files-found: error
