name: Temporary finish spacing fix

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arreglos-visuales

      - name: Apply focused visual fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'KCDM_Options/Border.lua',
              '    page.zoomSlider:SetPoint("TOPLEFT", page.zoomCheckbox, "BOTTOMLEFT", 20, -5)\n',
              '    page.zoomSlider:SetPoint("TOPLEFT", page.zoomCheckbox, "BOTTOMLEFT", 40, -5)\n',
              'Zoom Amount submenu indent',
          )
          replace_once(
              'KCDM_Options/Border.lua',
              '            page.hideOverlayCheckbox:SetPoint("TOPLEFT", page.zoomSlider, "BOTTOMLEFT", -20, -10)\n',
              '            page.hideOverlayCheckbox:SetPoint("TOPLEFT", page.zoomSlider, "BOTTOMLEFT", -40, -10)\n',
              'Independent checkbox base alignment',
          )
          replace_once(
              'KCDM_Options/Defensives.lua',
              '    local positionHeader = UI.CreateHeader(scrollChild, L["Position"])\n    positionHeader:SetPoint("TOPLEFT", 0, NextY(0))\n    NextY(15)\n\n    local lblAnchor = scrollChild:CreateFontString(nil, "ARTWORK", "KCDM_Font14")\n',
              '    local positionHeader = UI.CreateHeader(scrollChild, L["Position"])\n    positionHeader:SetPoint("TOPLEFT", 0, NextY(0))\n    NextY(30)\n\n    local lblAnchor = scrollChild:CreateFontString(nil, "ARTWORK", "KCDM_Font14")\n',
              'Defensives Position title spacing',
          )
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 >/dev/null
          luac5.1 -p KCDM_Options/Border.lua
          luac5.1 -p KCDM_Options/Defensives.lua
          grep -q 'page.zoomSlider:SetPoint("TOPLEFT", page.zoomCheckbox, "BOTTOMLEFT", 40, -5)' KCDM_Options/Border.lua
          grep -q 'page.hideOverlayCheckbox:SetPoint("TOPLEFT", page.zoomSlider, "BOTTOMLEFT", -40, -10)' KCDM_Options/Border.lua

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KCDM_Options/Border.lua KCDM_Options/Defensives.lua
          git commit -m "Finish submenu and section spacing fixes"
          git push origin HEAD:arreglos-visuales
