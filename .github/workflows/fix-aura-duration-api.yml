name: Fix aura duration API

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arreglos-visuales
          fetch-depth: 0

      - name: Apply API fix
        shell: python
        run: |
          from pathlib import Path

          p = Path('KCDM/Core/Style.lua')
          text = p.read_text(encoding='utf-8')

          old_guard = 'type(C_UnitAuras.GetAuraDuration) ~= "function"'
          new_guard = 'type(C_UnitAuras.GetUnitAuraDuration) ~= "function"'
          old_call = 'pcall(C_UnitAuras.GetAuraDuration, auraUnit, auraInstanceID)'
          new_call = 'pcall(C_UnitAuras.GetUnitAuraDuration, auraUnit, auraInstanceID)'

          if text.count(old_guard) != 1:
              raise SystemExit(f'expected exactly 1 old guard, found {text.count(old_guard)}')
          if text.count(old_call) != 1:
              raise SystemExit(f'expected exactly 1 old call, found {text.count(old_call)}')

          text = text.replace(old_guard, new_guard, 1)
          text = text.replace(old_call, new_call, 1)
          p.write_text(text, encoding='utf-8')

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate Lua and XML
        run: |
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)
          s = Path('KCDM/Core/Style.lua').read_text(encoding='utf-8')
          assert 'C_UnitAuras.GetUnitAuraDuration' in s
          assert 'C_UnitAuras.GetAuraDuration' not in s
          assert 'cd:SetCooldownFromDurationObject(durationObject)' in s
          PY

      - name: Commit fix
        run: |
          git config user.name 'Tronicolol'
          git config user.email '54152736+Tronicolol@users.noreply.github.com'
          git add KCDM/Core/Style.lua
          git commit -m 'Fix equipped item aura duration API [skip ci]'
          git push origin HEAD:arreglos-visuales

      - name: Build complete addon package
        run: |
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options

      - uses: actions/upload-artifact@v4
        with:
          name: KCDM-Aura-Numbers-Fix
          path: package/
          if-no-files-found: error
