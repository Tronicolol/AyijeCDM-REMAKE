name: Validate unified glow controller

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arreglos-visuales
          fetch-depth: 0

      - name: Fix charge ready-state calculation
        shell: python
        run: |
          from pathlib import Path
          p = Path('KCDM/Core/GlowDirector.lua')
          text = p.read_text(encoding='utf-8')
          old = '''local function ComputeCooldownReady(frame, spellID)\n    local ci = GetSpellCharges(spellID)\n    if ci and ci.maxCharges and ci.maxCharges > 1 then\n        if not ci.isActive then return true end\n        return HasChargeSource(frame)\n    end\n\n    local info = C_Spell_GetSpellCooldown(spellID)\n    if not info then return false end\n    return (not info.isActive) or info.isOnGCD\nend\n'''
          new = '''local function ComputeCooldownReady(frame, spellID)\n    local ci = GetSpellCharges(spellID)\n    if ci and ci.maxCharges and ci.maxCharges > 1 then\n        local currentCharges = ci.currentCharges\n        if IsSafeNumber(currentCharges) then\n            return currentCharges > 0\n        end\n        if not ci.isActive then return true end\n        return HasChargeSource(frame)\n    end\n\n    local info = C_Spell_GetSpellCooldown(spellID)\n    if not info then return false end\n    return (not info.isActive) or info.isOnGCD\nend\n'''
          if text.count(old) != 1:
              raise SystemExit('GlowDirector ComputeCooldownReady block mismatch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate Lua syntax
        run: |
          luac5.1 -p KCDM/Core/Glow.lua
          luac5.1 -p KCDM/Core/GlowDirector.lua
          luac5.1 -p KCDM/Modules/BlizzardProcSuppression.lua
          luac5.1 -p KCDM/Modules/PerSpellGlowType.lua
          luac5.1 -p KCDM/Modules/PerSpellGlowTypeResolver.lua
          luac5.1 -p KCDM/Modules/GlowController.lua

      - name: Validate controller invariants
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          controller = Path('KCDM/Modules/GlowController.lua').read_text(encoding='utf-8')
          required = [
              'local PRODUCER_ORDER = { "alert", "aura", "buff", "ready" }',
              'Glow.RequestBuffGlow = function',
              'Glow.InstallAcquireResetHook = function',
              'HardStopButton',
              'state.boundCooldownID ~= frame.cooldownID',
              'Glow.RefreshSpellGlowTypeOverrides = function',
          ]
          for token in required:
              if token not in controller:
                  raise SystemExit('Missing controller invariant: ' + token)
          root = ET.parse('KCDM/Modules/embeds.xml').getroot()
          files = [node.attrib.get('file') for node in root if node.tag.endswith('Script')]
          if 'GlowController.lua' not in files:
              raise SystemExit('GlowController.lua not loaded')
          if files.index('GlowController.lua') < files.index('PerSpellGlowTypeResolver.lua'):
              raise SystemExit('GlowController must load after legacy wrappers')
          for rel in files:
              if not Path('KCDM/Modules', rel).exists():
                  raise SystemExit('Missing module script: ' + str(rel))

      - name: Commit charge fix
        run: |
          if git diff --quiet -- KCDM/Core/GlowDirector.lua; then
            echo 'No GlowDirector change needed'
          else
            git config user.name 'Tronicolol'
            git config user.email '54152736+Tronicolol@users.noreply.github.com'
            git add KCDM/Core/GlowDirector.lua
            git commit -m 'Fix ready glow state for charge spells [skip ci]'
            git push origin HEAD:arreglos-visuales
          fi

      - name: Build clean KCDM package
        run: |
          mkdir -p package
          cp -a KCDM package/KCDM

      - uses: actions/upload-artifact@v4
        with:
          name: Ayije-Unified-Glow-Controller
          path: package/
          if-no-files-found: error
