name: Validate Show Overlay authority

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arreglos-visuales
          fetch-depth: 0

      - name: Apply Show Overlay authority fix
        shell: python
        run: |
          from pathlib import Path

          p = Path('KCDM/Core/Style.lua')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''local GetSpellCharges = C_Spell.GetSpellCharges\nlocal TruncateWhenZero = C_StringUtil.TruncateWhenZero\n''',
              '''local GetSpellCharges = C_Spell.GetSpellCharges\nlocal GetInventoryItemCooldown = GetInventoryItemCooldown\nlocal TruncateWhenZero = C_StringUtil.TruncateWhenZero\n''',
              'inventory cooldown local'
          )

          replace_once(
              '''local function IsEquippedItemCooldownFrame(frame)\n    if not frame or type(frame.GetEquipSlot) ~= "function" then return false end\n    local ok, equipSlot = pcall(frame.GetEquipSlot, frame)\n    return ok and IsSafeNumber(equipSlot) and equipSlot > 0\nend\n''',
              '''local function GetEquippedItemSlot(frame)\n    if not frame or type(frame.GetEquipSlot) ~= "function" then return nil end\n    local ok, equipSlot = pcall(frame.GetEquipSlot, frame)\n    if not ok or not IsSafeNumber(equipSlot) or equipSlot <= 0 then return nil end\n    return equipSlot\nend\n\nlocal function IsEquippedItemCooldownFrame(frame)\n    return GetEquippedItemSlot(frame) ~= nil\nend\n\nlocal function GetEquippedItemRealCooldown(frame)\n    local equipSlot = GetEquippedItemSlot(frame)\n    if not equipSlot or not GetInventoryItemCooldown then\n        return false, nil, nil, nil\n    end\n\n    -- Blizzard has already filtered shared trinket/GCD categories when it sets\n    -- isOnActualCooldown. Reuse that decision so an unused trinket never shows\n    -- the shared lockout as its own cooldown.\n    local actualState = frame.isOnActualCooldown\n    if actualState ~= nil and canaccessvalue(actualState) and actualState ~= true then\n        return false, nil, nil, nil\n    end\n\n    local startTime, duration, enable = GetInventoryItemCooldown("player", equipSlot)\n    local active = enable == 1\n        and type(startTime) == "number" and startTime > 0\n        and type(duration) == "number" and duration > CDM_C.ITEM_COOLDOWN_GCD_MIN\n\n    if actualState ~= nil and canaccessvalue(actualState) then\n        active = active and actualState == true\n    end\n\n    return active, startTime, duration, enable\nend\n''',
              'equipped item helpers'
          )

          replace_once(
              '''    elseif IsEquippedItemCooldownFrame(frame) then\n        local itemCooldownState = fallbackCooldownState\n        if itemCooldownState == nil then itemCooldownState = frame.cooldownDesaturated end\n        if itemCooldownState ~= nil and canaccessvalue(itemCooldownState) then\n            onCooldown = itemCooldownState == true\n        end\n''',
              '''    elseif IsEquippedItemCooldownFrame(frame) then\n        onCooldown = GetEquippedItemRealCooldown(frame) == true\n''',
              'equipped item tint uses real cooldown'
          )

          replace_once(
              '''    elseif IsEquippedItemCooldownFrame(frame) then\n        local boolDesat = blizzDesat\n        if boolDesat == nil then boolDesat = frame.cooldownDesaturated end\n        if boolDesat ~= nil and canaccessvalue(boolDesat) and not styleCache.disableCooldownDesat then\n            desat = EvaluateColorValueFromBoolean(boolDesat, 1, 0)\n        end\n''',
              '''    elseif IsEquippedItemCooldownFrame(frame) then\n        if not styleCache.disableCooldownDesat and GetEquippedItemRealCooldown(frame) == true then\n            desat = 1\n        end\n''',
              'equipped item desat uses real cooldown'
          )

          replace_once(
              '''        if IsEquippedItemCooldownFrame(frame) then\n            -- Blizzard has dedicated equipped-item cooldown logic (including\n            -- suppression of shared item/GCD categories). Keep its timer intact.\n            cd:SetDrawEdge(false)\n        elseif HasChargeSource(frame) then\n''',
              '''        if IsEquippedItemCooldownFrame(frame) then\n            -- Show Overlay is the only setting allowed to expose Blizzard's aura\n            -- timer. Without it, always render the equipped item's real cooldown.\n            cd:SetReverse(false)\n            cd:SetUseAuraDisplayTime(false)\n            cd:SetDrawEdge(false)\n            local active, startTime, duration = GetEquippedItemRealCooldown(frame)\n            if active then\n                if not frame.cdmEquippedItemDurationObj then\n                    frame.cdmEquippedItemDurationObj = C_DurationUtil.CreateDuration()\n                end\n                frame.cdmEquippedItemDurationObj:SetTimeFromStart(startTime, duration)\n                cd:SetCooldownFromDurationObject(frame.cdmEquippedItemDurationObj)\n                cd:SetDrawSwipe(true)\n            else\n                cd:Clear()\n            end\n        elseif HasChargeSource(frame) then\n''',
              'equipped item timer ignores native aura unless configured'
          )

          replace_once(
              '''    local entry = FindAuraOverlayEntry(frame)\n    local auraActive = (frame.cooldownUseAuraDisplayTime == true)\n    local sid = GetCastSpellID(frame)\n''',
              '''    local entry = FindAuraOverlayEntry(frame)\n    local blizzardAuraActive = (frame.cooldownUseAuraDisplayTime == true)\n    local auraActive = entry and entry.auraOverlay == true and blizzardAuraActive or false\n    local sid = GetCastSpellID(frame)\n''',
              'Show Overlay owns aura-active state'
          )

          p.write_text(text, encoding='utf-8')

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate complete addon
        run: |
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          git diff --check

      - name: Validate XML and invariants
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)

          s = Path('KCDM/Core/Style.lua').read_text(encoding='utf-8')
          required = [
              'local function GetEquippedItemRealCooldown(frame)',
              'local auraActive = entry and entry.auraOverlay == true and blizzardAuraActive or false',
              'frame.cdmEquippedItemDurationObj:SetTimeFromStart(startTime, duration)',
              'onCooldown = GetEquippedItemRealCooldown(frame) == true',
              'Show Overlay is the only setting allowed',
          ]
          for token in required:
              assert token in s, token

      - name: Commit fix
        run: |
          git config user.name 'Tronicolol'
          git config user.email '54152736+Tronicolol@users.noreply.github.com'
          git add KCDM/Core/Style.lua
          git commit -m 'Make Show Overlay authoritative for equipped item auras [skip ci]'
          git push origin HEAD:arreglos-visuales

      - name: Build complete addon package
        run: |
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options

      - uses: actions/upload-artifact@v4
        with:
          name: Ayije-Complete-Show-Overlay-Fix
          path: package/
          if-no-files-found: error
