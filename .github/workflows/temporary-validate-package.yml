name: Temporary validate and package

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arreglos-visuales
          fetch-depth: 0

      - name: Validate diff
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff --check origin/main...HEAD

      - name: Install Lua parser
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1

      - name: Validate modified Lua syntax
        shell: bash
        run: |
          luac5.1 -p KCDM/Config/Defaults.lua
          luac5.1 -p KCDM/Core/Main.lua
          luac5.1 -p KCDM/Modules/Racials.lua
          luac5.1 -p KCDM/Modules/RacialsPartyAnchorMigration.lua
          luac5.1 -p KCDM_Options/ConfigKeys.lua
          luac5.1 -p KCDM_Options/SectionSpacing.lua
          luac5.1 -p KCDM_Options/Sizes.lua
          luac5.1 -p KCDM_Options/Layout.lua
          luac5.1 -p KCDM_Options/Text.lua
          luac5.1 -p KCDM_Options/Glow.lua
          luac5.1 -p KCDM_Options/Bars.lua
          luac5.1 -p KCDM_Options/BuffGroups.lua
          luac5.1 -p KCDM_Options/Racials.lua

      - name: Validate removals and preserved behavior
        shell: bash
        run: |
          ! grep -q 'Add Spell' KCDM_Options/Bars.lua
          ! grep -q 'Add Icon' KCDM_Options/BuffGroups.lua
          grep -q 'Add Custom Buff' KCDM_Options/BuffGroups.lua
          ! grep -E -q 'racialsUsePartyFrame|racialsPartyFrame|racialsRaidFrame|ResolvePartyAnchorFrame|DandersFrames|Grid2Layout|CompactPartyFrameMember|CellPartyFrameMember|ElvUF_PartyGroup1UnitButton' KCDM/Modules/Racials.lua KCDM_Options/Racials.lua KCDM/Config/Defaults.lua KCDM_Options/ConfigKeys.lua
          test ! -e KCDM_Options/RemovedControls.lua
          test ! -e KCDM/Modules/Externals.lua
          test ! -e KCDM_Options/Externals.lua
          ! grep -q 'Externals.lua' KCDM/Modules/embeds.xml
          ! grep -q 'Externals.lua' KCDM_Options/embeds.xml
          grep -q 'SectionSpacing.lua' KCDM_Options/embeds.xml
          grep -q 'RacialsPartyAnchorMigration.lua' KCDM/Modules/embeds.xml

      - name: Validate XML load targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for xml_path in (Path('KCDM/Modules/embeds.xml'), Path('KCDM_Options/embeds.xml')):
              root = ET.parse(xml_path).getroot()
              missing = []
              for elem in root.iter():
                  if elem.tag.endswith('Script'):
                      rel = elem.attrib.get('file')
                      if rel and not (xml_path.parent / rel).exists():
                          missing.append(rel)
              if missing:
                  raise SystemExit(f'{xml_path}: missing load targets: {missing}')
              print(f'{xml_path}: OK')
          PY

      - name: Upload clean addon package
        uses: actions/upload-artifact@v4
        with:
          name: Ayije-arreglos-visuales-COMPLETE
          path: |
            KCDM
            KCDM_Options
          if-no-files-found: error
          retention-days: 1
