name: Fix trinket aura-state gate

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arreglos-visuales
          fetch-depth: 0

      - name: Apply focused runtime fix
        shell: python
        run: |
          from pathlib import Path

          p = Path('KCDM/Core/Style.lua')
          text = p.read_text(encoding='utf-8')

          start = text.index('local function GetEquippedItemRealCooldown(frame)')
          end = text.index('\nlocal function HasChargeSource(frame)', start)
          helper = text[start:end]

          old_detector = '    local hasLiveAura = GetCachedAuraDuration(frame) ~= nil'
          new_detector = '    local auraOwnsVisualState = frame.wasSetFromAura == true\n        or frame.cooldownUseAuraDisplayTime == true'

          if helper.count(old_detector) != 1:
              raise SystemExit(f'expected one aura detector, found {helper.count(old_detector)}')
          if helper.count('not hasLiveAura') != 2:
              raise SystemExit(f'expected two hasLiveAura gates, found {helper.count("not hasLiveAura")}')

          helper = helper.replace(old_detector, new_detector, 1)
          helper = helper.replace('not hasLiveAura', 'not auraOwnsVisualState')
          text = text[:start] + helper + text[end:]
          p.write_text(text, encoding='utf-8')

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate addon
        run: |
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          git diff --check

      - name: Validate XML and focused invariants
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)

          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert changed == ['KCDM/Core/Style.lua'], changed

          s = Path('KCDM/Core/Style.lua').read_text(encoding='utf-8')
          start = s.index('local function GetEquippedItemRealCooldown(frame)')
          end = s.index('\nlocal function HasChargeSource(frame)', start)
          helper = s[start:end]

          assert 'local auraOwnsVisualState = frame.wasSetFromAura == true' in helper
          assert 'or frame.cooldownUseAuraDisplayTime == true' in helper
          assert helper.count('not auraOwnsVisualState') == 2
          assert 'local hasLiveAura = GetCachedAuraDuration(frame) ~= nil' not in helper
          assert 'GetInventoryItemCooldown("player", equipSlot)' in helper
          assert 'duration > CDM_C.ITEM_COOLDOWN_GCD_MIN' in helper

          assert 'if isEquippedItem and entry and entry.auraOverlay then' in s
          assert 'if ApplyEquippedItemAuraCooldown(frame, cd) then' in s

      - name: Commit fix
        run: |
          git config user.name 'Tronicolol'
          git config user.email '54152736+Tronicolol@users.noreply.github.com'
          git add KCDM/Core/Style.lua
          git commit -m 'Use Blizzard aura source flags for real trinket cooldown [skip ci]'
          git push origin HEAD:arreglos-visuales

      - name: Build complete addon package
        run: |
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options

      - name: Verify complete package roots
        shell: python
        run: |
          from pathlib import Path
          roots = sorted(p.name for p in Path('package').iterdir())
          assert roots == ['KCDM', 'KCDM_Options'], roots
          assert Path('package/KCDM/KCDM.toc').is_file()
          assert Path('package/KCDM_Options/KCDM_Options.toc').is_file()

      - uses: actions/upload-artifact@v4
        with:
          name: KCDM-Trinket-Aura-State-Gate-Fix
          path: package/
          if-no-files-found: error
