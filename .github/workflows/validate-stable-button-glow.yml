name: Validate stable button glow

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[validate-stable-button-glow]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate Lua and XML
        shell: bash
        run: |
          set -euo pipefail
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)
          PY

      - name: Validate glow renderer
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'StartOrUpdateStableButtonGlow' KCDM/Modules/GlowController.lua
          grep -q 'StopStableButtonGlow' KCDM/Modules/GlowController.lua
          grep -q 'SetFlipBookFrames(BUTTON_GLOW_FRAMES)' KCDM/Modules/GlowController.lua
          grep -q 'SetLooping("REPEAT")' KCDM/Modules/GlowController.lua
          ! grep -q 'LCG.ButtonGlow_Start' KCDM/Modules/GlowController.lua
          grep -q 'LCG.PixelGlow_Start' KCDM/Modules/GlowController.lua
          grep -q 'LCG.AutoCastGlow_Start' KCDM/Modules/GlowController.lua
          grep -q 'LCG.ProcGlow_Start' KCDM/Modules/GlowController.lua
          test ! -e KCDM/Modules/GlowLifecycleDebug.lua
          ! grep -R -n -E 'GlowLifecycleTrace|KCDMGLOWDIAG|READY_COMPUTE|READY_DECISION' KCDM KCDM_Options

      - name: Build complete package
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options
          test -f package/KCDM/KCDM.toc
          test -f package/KCDM_Options/KCDM_Options.toc
          roots="$(find package -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')"
          test "$roots" = "KCDM KCDM_Options "

      - uses: actions/upload-artifact@v4
        with:
          name: KCDM-main-stable-button-glow
          path: package/
          if-no-files-found: error
          retention-days: 7
