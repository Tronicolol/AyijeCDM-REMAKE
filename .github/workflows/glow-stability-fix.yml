name: Glow stability fix

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arreglos-visuales
          fetch-depth: 0

      - name: Apply glow stability fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          glow = 'KCDM/Core/Glow.lua'
          replace_once(
              glow,
              '''local activeGlowFrames = setmetatable({}, { __mode = "k" })\nlocal pendingHideFrames = setmetatable({}, { __mode = "k" })\nlocal buffHookedFrames = setmetatable({}, { __mode = "k" })\nlocal HideCustomGlow\n''',
              '''local activeGlowFrames = setmetatable({}, { __mode = "k" })\nlocal pendingHideFrames = setmetatable({}, { __mode = "k" })\nlocal pendingVisualHideFrames = setmetatable({}, { __mode = "k" })\nlocal buffHookedFrames = setmetatable({}, { __mode = "k" })\nlocal HideCustomGlow\n''',
              'Glow pending visual hide state'
          )

          replace_once(
              glow,
              '''debounceDrainer:SetScript("OnUpdate", DrainPendingHide)\n\nlocal function IsSupportedViewerName(name)\n''',
              '''debounceDrainer:SetScript("OnUpdate", DrainPendingHide)\n\nlocal visualHideDrainer = CreateFrame("Frame")\nvisualHideDrainer:Hide()\n\nlocal function DrainPendingVisualHide()\n    visualHideDrainer:Hide()\n    for frame in pairs(pendingVisualHideFrames) do\n        pendingVisualHideFrames[frame] = nil\n        if not frame.cdmGlowProducer then\n            local host = frame.cdmBuffGlowHost\n            if host then\n                HideCustomGlow(host)\n                host:Hide()\n            else\n                HideCustomGlow(frame)\n            end\n        end\n    end\nend\n\nvisualHideDrainer:SetScript("OnUpdate", DrainPendingVisualHide)\n\nlocal function IsSupportedViewerName(name)\n''',
              'Glow deferred visual hide drainer'
          )

          replace_once(
              glow,
              '''    if enabled then\n        local current = frame.cdmGlowProducer\n''',
              '''    if enabled then\n        pendingVisualHideFrames[frame] = nil\n\n        local current = frame.cdmGlowProducer\n''',
              'Glow cancel pending hide on enable'
          )

          replace_once(
              glow,
              '''        local host = frame.cdmBuffGlowHost\n        if host then\n            HideCustomGlow(host)\n            host:Hide()\n        else\n            HideCustomGlow(frame)\n        end\n    end\nend\n\nfunction Glow:HideBlizzardGlow(frame)\n''',
              '''        pendingVisualHideFrames[frame] = true\n        visualHideDrainer:Show()\n    end\nend\n\nfunction Glow:HideBlizzardGlow(frame)\n''',
              'Glow defer producer visual hide'
          )

          replace_once(
              glow,
              '''function Glow:StopGlow(frame)\n    if frame then\n        self:HidePandemicGlow(frame)\n''',
              '''function Glow:StopGlow(frame)\n    if frame then\n        pendingVisualHideFrames[frame] = nil\n        self:HidePandemicGlow(frame)\n''',
              'Glow stop cancels deferred hide'
          )

          replace_once(
              glow,
              '''function Glow:RefreshActiveGlows()\n    if not LCG then return end\n\n    DrainPendingHide()\n''',
              '''function Glow:RefreshActiveGlows()\n    if not LCG then return end\n\n    DrainPendingHide()\n    DrainPendingVisualHide()\n''',
              'Glow refresh drains deferred hide'
          )

          replace_once(
              glow,
              '''        pendingHideFrames[frame] = nil\n\n        HideBlizzardGlow(frame)\n        Glow:RequestBuffGlow(frame, "alert", true, nil, nil)\n''',
              '''        pendingHideFrames[frame] = nil\n\n        HideBlizzardGlow(frame)\n        if Glow.ShouldSuppressAlert and Glow:ShouldSuppressAlert(frame) then\n            Glow:RequestBuffGlow(frame, "alert", false, nil, nil)\n            if CDM.RefreshFrameVisuals then\n                C_Timer.After(0, function()\n                    if frame then CDM:RefreshFrameVisuals(frame) end\n                end)\n            end\n            return\n        end\n\n        Glow:RequestBuffGlow(frame, "alert", true, nil, nil)\n''',
              'Glow suppress alert before custom start'
          )

          replace_once(
              glow,
              '''local function GlowCfg(db, defaults, key)\n    if db[key] ~= nil then return db[key] end\n    return defaults[key]\nend\n\nfunction Glow:RefreshCache()\n''',
              '''local function GlowCfg(db, defaults, key)\n    if db[key] ~= nil then return db[key] end\n    return defaults[key]\nend\n\nlocal function SignatureValue(value)\n    if value == nil then return "<nil>" end\n    if value == true then return "1" end\n    if value == false then return "0" end\n    return tostring(value)\nend\n\nlocal function BuildGlowVisualSignature()\n    local color = glowCache.color or {}\n    return table.concat({\n        SignatureValue(glowCache.type),\n        SignatureValue(glowCache.useCustomColor),\n        SignatureValue(color.r), SignatureValue(color.g), SignatureValue(color.b), SignatureValue(color.a),\n        SignatureValue(glowCache.pixelLines), SignatureValue(glowCache.pixelFrequency),\n        SignatureValue(glowCache.pixelLength), SignatureValue(glowCache.pixelThickness),\n        SignatureValue(glowCache.pixelXOffset), SignatureValue(glowCache.pixelYOffset),\n        SignatureValue(glowCache.pixelBorder),\n        SignatureValue(glowCache.autocastParticles), SignatureValue(glowCache.autocastFrequency),\n        SignatureValue(glowCache.autocastScale), SignatureValue(glowCache.autocastXOffset),\n        SignatureValue(glowCache.autocastYOffset),\n        SignatureValue(glowCache.buttonFrequency),\n        SignatureValue(glowCache.procDuration), SignatureValue(glowCache.procXOffset),\n        SignatureValue(glowCache.procYOffset)\n    }, "|")\nend\n\nfunction Glow:RefreshCache()\n''',
              'Glow visual signature helper'
          )

          replace_once(
              glow,
              '''    if not glowStartFunctions[glowCache.type] then\n        glowCache.type = "proc"\n    end\n\n    self:RefreshActiveGlows()\nend\n''',
              '''    if not glowStartFunctions[glowCache.type] then\n        glowCache.type = "proc"\n    end\n\n    local signature = BuildGlowVisualSignature()\n    if self.visualConfigSignature ~= signature then\n        self.visualConfigSignature = signature\n        self.visualConfigVersion = (self.visualConfigVersion or 0) + 1\n        self:RefreshActiveGlows()\n    end\nend\n''',
              'Glow refresh only on actual glow config changes'
          )

          director = 'KCDM/Core/GlowDirector.lua'
          replace_once(
              director,
              '''function GlowDirector:InstallAcquireResetHook(v)\n    hooksecurefunc(v, "OnAcquireItemFrame", function(_, itemFrame)\n        -- Keep the previous registration until SetCooldownID/ClearCooldownID can remove it.\n        -- Clearing it here leaves recycled frames registered under an old cooldownID.\n        if itemFrame.cdmGlowLifecycleHooked then return end\n        itemFrame.cdmGlowLifecycleHooked = true\n\n        hooksecurefunc(itemFrame, "SetCooldownID", function(self)\n            if self.cooldownID == self.cdmGlowDirectorCdID then return end\n            GlowDirector:OnCooldownIDSet(self)\n        end)\n\n        hooksecurefunc(itemFrame, "ClearCooldownID", function(self)\n            GlowDirector:OnCooldownIDCleared(self)\n        end)\n\n        hooksecurefunc(itemFrame, "SetOverrideSpell", function(self)\n            if not self.cdmGlowDirectorCdID then return end\n            GlowDirector:OnCooldownIDSet(self)\n        end)\n    end)\nend\n''',
              '''local acquireResyncPending = setmetatable({}, { __mode = "k" })\n\nlocal function QueueAcquireResync(frame)\n    if not frame or acquireResyncPending[frame] then return end\n    acquireResyncPending[frame] = true\n\n    C_Timer_After(0, function()\n        acquireResyncPending[frame] = nil\n        if not frame then return end\n\n        local cdID = frame.cooldownID\n        if not cdID then\n            GlowDirector:OnCooldownIDCleared(frame)\n            return\n        end\n\n        if frame.cdmGlowDirectorCdID == cdID then\n            RequestFanout(cdID)\n        else\n            GlowDirector:OnCooldownIDSet(frame)\n        end\n    end)\nend\n\nfunction GlowDirector:InstallAcquireResetHook(v)\n    hooksecurefunc(v, "OnAcquireItemFrame", function(_, itemFrame)\n        -- Keep the previous registration until SetCooldownID/ClearCooldownID can remove it.\n        -- Clearing it here leaves recycled frames registered under an old cooldownID.\n        if not itemFrame.cdmGlowLifecycleHooked then\n            itemFrame.cdmGlowLifecycleHooked = true\n\n            hooksecurefunc(itemFrame, "SetCooldownID", function(self)\n                if self.cooldownID == self.cdmGlowDirectorCdID then return end\n                GlowDirector:OnCooldownIDSet(self)\n            end)\n\n            hooksecurefunc(itemFrame, "ClearCooldownID", function(self)\n                GlowDirector:OnCooldownIDCleared(self)\n            end)\n\n            hooksecurefunc(itemFrame, "SetOverrideSpell", function(self)\n                if not self.cdmGlowDirectorCdID then return end\n                GlowDirector:OnCooldownIDSet(self)\n            end)\n        end\n\n        -- Blizzard can reacquire the same frame with the same cooldownID when\n        -- settings/layout state changes. The visual glow reset still ran, so\n        -- always reconcile once the acquire cycle has finished.\n        QueueAcquireResync(itemFrame)\n    end)\nend\n''',
              'GlowDirector reacquire reconciliation'
          )

          per_spell = 'KCDM/Modules/PerSpellGlowType.lua'
          replace_once(
              per_spell,
              '''local originalRequestBuffGlow = Glow.RequestBuffGlow\nlocal originalStopGlow = Glow.StopGlow\nlocal originalInstallAcquireResetHook = Glow.InstallAcquireResetHook\nif type(originalRequestBuffGlow) ~= "function" or type(originalStopGlow) ~= "function" then return end\n''',
              '''local originalRequestBuffGlow = Glow.RequestBuffGlow\nlocal originalStopGlow = Glow.StopGlow\nif type(originalRequestBuffGlow) ~= "function" or type(originalStopGlow) ~= "function" then return end\n''',
              'PerSpell remove acquire wrapper dependency'
          )

          replace_once(
              per_spell,
              '''local customStates = setmetatable({}, { __mode = "k" })\nlocal pendingDisableGeneration = setmetatable({}, { __mode = "k" })\n''',
              '''local customStates = setmetatable({}, { __mode = "k" })\nlocal pendingDisableGeneration = setmetatable({}, { __mode = "k" })\nlocal lastVisualConfigVersion = Glow.visualConfigVersion or 0\n''',
              'PerSpell visual config version state'
          )

          replace_once(
              per_spell,
              '''if type(originalInstallAcquireResetHook) == "function" then\n    Glow.InstallAcquireResetHook = function(self, viewer)\n        originalInstallAcquireResetHook(self, viewer)\n\n        hooksecurefunc(viewer, "OnAcquireItemFrame", function(_, itemFrame)\n            local state = customStates[itemFrame]\n            if state then\n                StopCustomState(itemFrame, state)\n            end\n        end)\n    end\nend\n\n''',
              '''''',
              'PerSpell remove destructive reacquire stop'
          )

          replace_once(
              per_spell,
              '''CDM:RegisterRefreshCallback("perSpellGlowType", function()\n    Glow:RefreshSpellGlowTypeOverrides(true)\nend, 55, { "STYLE" })\n''',
              '''CDM:RegisterRefreshCallback("perSpellGlowType", function()\n    local visualConfigVersion = Glow.visualConfigVersion or 0\n    local forceUpdate = visualConfigVersion ~= lastVisualConfigVersion\n    lastVisualConfigVersion = visualConfigVersion\n    Glow:RefreshSpellGlowTypeOverrides(forceUpdate)\nend, 55, { "STYLE" })\n''',
              'PerSpell avoid restart on unrelated STYLE refresh'
          )

          suppression = 'KCDM/Modules/BlizzardProcSuppression.lua'
          replace_once(
              suppression,
              '''local originalHookAlertManager = Glow.HookAlertManager\nif type(originalHookAlertManager) ~= "function" then return end\n\n''',
              '''''',
              'Proc suppression remove second alert hook dependency'
          )

          replace_once(
              suppression,
              '''local function ShouldHideBlizzardProcGlow(frame)\n    local groupedOverride, isGrouped = GetGroupedOverride(frame)\n    if isGrouped then\n        local hide = ReadHideFlag(groupedOverride)\n        return hide\n    end\n\n    if not CDM.GetUngroupedCooldownOverride then return false end\n\n    local info = frame.GetCooldownInfo and frame:GetCooldownInfo() or frame.cooldownInfo\n    if info and info.overrideTooltipSpellID then\n        local override = CDM:GetUngroupedCooldownOverride(info.overrideTooltipSpellID)\n        local hide, found = ReadHideFlag(override)\n        if found then return hide end\n    end\n\n    if CDM.GetSpellIDCandidates then\n        for _, spellID in ipairs(CDM:GetSpellIDCandidates(frame)) do\n            local override = CDM:GetUngroupedCooldownOverride(spellID)\n            local hide, found = ReadHideFlag(override)\n            if found then return hide end\n        end\n    end\n\n    return false\nend\n''',
              '''local function ShouldHideBlizzardProcGlow(frame)\n    local groupedOverride, isGrouped = GetGroupedOverride(frame)\n    if isGrouped then\n        local hide = ReadHideFlag(groupedOverride)\n        return hide\n    end\n\n    if not CDM.GetUngroupedCooldownOverride then return false end\n\n    local info = frame.GetCooldownInfo and frame:GetCooldownInfo() or frame.cooldownInfo\n    if info and info.overrideTooltipSpellID then\n        local override = CDM:GetUngroupedCooldownOverride(info.overrideTooltipSpellID)\n        local hide, found = ReadHideFlag(override)\n        if found then return hide end\n    end\n\n    if CDM.GetSpellIDCandidates then\n        for _, spellID in ipairs(CDM:GetSpellIDCandidates(frame)) do\n            local override = CDM:GetUngroupedCooldownOverride(spellID)\n            local hide, found = ReadHideFlag(override)\n            if found then return hide end\n        end\n    end\n\n    return false\nend\n\nfunction Glow:ShouldSuppressAlert(frame)\n    return IsManagedCooldownFrame(frame) and ShouldHideBlizzardProcGlow(frame)\nend\n''',
              'Proc suppression expose predicate'
          )

          replace_once(
              suppression,
              '''function Glow:RefreshBlizzardProcSuppression()\n    if not CDM.ForEachActiveFrame then return end\n\n    CDM:ForEachActiveFrame({ VIEWERS.ESSENTIAL, VIEWERS.UTILITY }, function(frame)\n        if ShouldHideBlizzardProcGlow(frame) then\n            self:HideBlizzardGlow(frame)\n            self:RequestBuffGlow(frame, "alert", false)\n        end\n    end)\nend\n\nGlow.HookAlertManager = function(self)\n    originalHookAlertManager(self)\n\n    if self.blizzardProcSuppressionHooked then return end\n\n    local alertManager = _G.ActionButtonSpellAlertManager\n    if not alertManager then return end\n\n    hooksecurefunc(alertManager, "ShowAlert", function(_, frame)\n        if not IsManagedCooldownFrame(frame) then return end\n        if not ShouldHideBlizzardProcGlow(frame) then return end\n\n        self:HideBlizzardGlow(frame)\n        self:RequestBuffGlow(frame, "alert", false)\n    end)\n\n    self.blizzardProcSuppressionHooked = true\nend\n''',
              '''local refreshPending = setmetatable({}, { __mode = "k" })\n\nlocal function QueueFrameRefresh(frame)\n    if not frame or refreshPending[frame] then return end\n    refreshPending[frame] = true\n    C_Timer.After(0, function()\n        refreshPending[frame] = nil\n        if frame and CDM.RefreshFrameVisuals then\n            CDM:RefreshFrameVisuals(frame)\n        end\n    end)\nend\n\nfunction Glow:RefreshBlizzardProcSuppression()\n    if not CDM.ForEachActiveFrame then return end\n\n    CDM:ForEachActiveFrame({ VIEWERS.ESSENTIAL, VIEWERS.UTILITY }, function(frame)\n        if ShouldHideBlizzardProcGlow(frame) then\n            self:HideBlizzardGlow(frame)\n            self:RequestBuffGlow(frame, "alert", false)\n            QueueFrameRefresh(frame)\n        end\n    end)\nend\n''',
              'Proc suppression avoid double ShowAlert hook'
          )

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate changed Lua files
        run: |
          set -euo pipefail
          luac5.1 -p KCDM/Core/Glow.lua
          luac5.1 -p KCDM/Core/GlowDirector.lua
          luac5.1 -p KCDM/Modules/PerSpellGlowType.lua
          luac5.1 -p KCDM/Modules/BlizzardProcSuppression.lua

      - name: Validate glow invariants
        shell: python
        run: |
          from pathlib import Path
          glow = Path('KCDM/Core/Glow.lua').read_text(encoding='utf-8')
          director = Path('KCDM/Core/GlowDirector.lua').read_text(encoding='utf-8')
          per = Path('KCDM/Modules/PerSpellGlowType.lua').read_text(encoding='utf-8')
          suppression = Path('KCDM/Modules/BlizzardProcSuppression.lua').read_text(encoding='utf-8')

          required = [
              ('deferred base glow hide', 'pendingVisualHideFrames' in glow),
              ('glow visual config version', 'visualConfigVersion' in glow),
              ('alert suppression predicate use', 'ShouldSuppressAlert' in glow),
              ('reacquire reconciliation', 'QueueAcquireResync' in director),
              ('per-spell version-aware refresh', 'lastVisualConfigVersion' in per),
              ('suppression predicate exposure', 'function Glow:ShouldSuppressAlert' in suppression),
          ]
          failed = [name for name, ok in required if not ok]
          if failed:
              raise SystemExit('Missing glow fixes: ' + ', '.join(failed))

          forbidden = [
              ('destructive per-spell acquire hook', 'originalInstallAcquireResetHook' in per),
              ('duplicate suppression ShowAlert hook', 'Glow.HookAlertManager = function' in suppression),
          ]
          failed = [name for name, present in forbidden if present]
          if failed:
              raise SystemExit('Old glow paths still present: ' + ', '.join(failed))

      - name: Commit bugfix
        run: |
          set -euo pipefail
          git config user.name "Tronicolol"
          git config user.email "54152736+Tronicolol@users.noreply.github.com"
          git add KCDM/Core/Glow.lua KCDM/Core/GlowDirector.lua KCDM/Modules/PerSpellGlowType.lua KCDM/Modules/BlizzardProcSuppression.lua
          git diff --cached --check
          git commit -m "Stabilize glow lifecycle and refreshes [skip ci]"
          git push origin HEAD:arreglos-visuales

      - name: Build test patch
        run: |
          mkdir -p glow-patch/KCDM/Core glow-patch/KCDM/Modules
          cp KCDM/Core/Glow.lua glow-patch/KCDM/Core/
          cp KCDM/Core/GlowDirector.lua glow-patch/KCDM/Core/
          cp KCDM/Modules/PerSpellGlowType.lua glow-patch/KCDM/Modules/
          cp KCDM/Modules/BlizzardProcSuppression.lua glow-patch/KCDM/Modules/

      - uses: actions/upload-artifact@v4
        with:
          name: Ayije-Glow-Stability-Bugfix
          path: glow-patch/
          if-no-files-found: error
