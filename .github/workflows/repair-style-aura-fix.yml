name: Repair Style aura fix

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arreglos-visuales
          fetch-depth: 3

      - name: Restore complete Style.lua and apply focused fix
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          p = Path('KCDM/Core/Style.lua')
          previous = subprocess.check_output(['git', 'show', 'HEAD^^:KCDM/Core/Style.lua'], text=True)
          s = previous

          start = s.index('local function ApplyNativeAuraCooldown(frame, cd)')
          end = s.index('local function HasChargeSource(frame)', start)
          s = s[:start] + s[end:]

          marker = '''local function FindAuraOverlayEntry(frame)\n    local map = CDM._auraOverlayEnabled\n    if not map then return nil end\n    local cdID = frame and frame.cooldownID\n    if cdID and map[cdID] then return map[cdID] end\n    return nil\nend\n\n'''
          helper = '''local function QueueEquippedItemNativeRefresh(frame)\n    if not frame or frame.cdmEquippedItemNativeRefreshPending then return end\n    if type(frame.RefreshData) ~= "function" then return end\n\n    frame.cdmEquippedItemNativeRefreshPending = true\n    C_Timer.After(0, function()\n        frame.cdmEquippedItemNativeRefreshPending = nil\n        if not frame.cooldownID then return end\n        local entry = FindAuraOverlayEntry(frame)\n        if not entry or entry.auraOverlay ~= true then return end\n        pcall(frame.RefreshData, frame)\n    end)\nend\n\n'''
          assert marker in s
          s = s.replace(marker, marker + helper, 1)

          old = '''local function ApplyCooldownWidget(frame, entry, auraActive, sid)\n    local cd = frame.Cooldown\n    frame.cdmInternalWrite = true\n\n    local hideCountdown = false\n\n    if entry and entry.auraOverlay and auraActive then\n        cd:SetAlpha(1)\n        cd:SetDrawEdge(false)\n        if IsEquippedItemCooldownFrame(frame) then\n            cd:SetReverse(false)\n            ApplyNativeAuraCooldown(frame, cd)\n        else\n            cd:SetReverse(true)\n            cd:SetUseAuraDisplayTime(true)\n            cd:SetDrawSwipe(true)\n        end\n        frame.cdmCooldownOverlayStyleApplied = true\n    elseif entry and entry.auraOverlay and not auraActive and entry.auraDesaturateInactive then\n'''
          new = '''local function ApplyCooldownWidget(frame, entry, auraActive, sid)\n    local cd = frame.Cooldown\n    local isEquippedItem = IsEquippedItemCooldownFrame(frame)\n    frame.cdmInternalWrite = true\n\n    local hideCountdown = false\n\n    if isEquippedItem and entry and entry.auraOverlay then\n        if frame.cdmEquippedItemNativeOverlay ~= true then\n            frame.cdmEquippedItemNativeOverlay = true\n            QueueEquippedItemNativeRefresh(frame)\n        end\n        cd:SetHideCountdownNumbers(false)\n        frame.cdmInternalWrite = false\n        return\n    end\n\n    if isEquippedItem then\n        frame.cdmEquippedItemNativeOverlay = nil\n    end\n\n    if entry and entry.auraOverlay and auraActive then\n        cd:SetReverse(true)\n        cd:SetAlpha(1)\n        cd:SetDrawEdge(false)\n        cd:SetUseAuraDisplayTime(true)\n        cd:SetDrawSwipe(true)\n        frame.cdmCooldownOverlayStyleApplied = true\n    elseif entry and entry.auraOverlay and not auraActive and entry.auraDesaturateInactive then\n'''
          assert old in s
          s = s.replace(old, new, 1)

          s = s.replace('''        if IsEquippedItemCooldownFrame(frame) then\n            -- Show Overlay is the only setting allowed to expose Blizzard's aura\n''', '''        if isEquippedItem then\n            -- Show Overlay is the only setting allowed to expose Blizzard's aura\n''', 1)

          marker2 = '''    if frame.ShowPandemicStateFrame and not frame.cdmPandemicHooked then\n'''
          hook = '''    if hookType == "cooldown" and type(frame.RefreshData) == "function" and not frame.cdmRefreshDataVisualHooked then\n        frame.cdmRefreshDataVisualHooked = true\n        hooksecurefunc(frame, "RefreshData", function(self)\n            if self.cdmRefreshDataVisualPending then return end\n            self.cdmRefreshDataVisualPending = true\n            C_Timer.After(0, function()\n                self.cdmRefreshDataVisualPending = nil\n                if not self.cooldownID then return end\n                if not VIEWERS_WITH_OVERRIDE[self.cdmViewerName] then return end\n                CDM:RefreshFrameVisuals(self)\n            end)\n        end)\n    end\n\n'''
          assert marker2 in s
          s = s.replace(marker2, hook + marker2, 1)

          oldhook = '''                hooksecurefunc(cd, "SetCooldown", function()\n                    local entry = FindAuraOverlayEntry(frame)\n'''
          newhook = '''                hooksecurefunc(cd, "SetCooldown", function()\n                    if frame.cdmInternalWrite then return end\n                    local entry = FindAuraOverlayEntry(frame)\n'''
          assert oldhook in s
          s = s.replace(oldhook, newhook, 1)

          oldreset = '''        itemFrame.cdmLastAuraActive = nil\n        itemFrame.cdmLastBuffBorderSpellID = nil\n'''
          newreset = '''        itemFrame.cdmLastAuraActive = nil\n        itemFrame.cdmEquippedItemNativeOverlay = nil\n        itemFrame.cdmEquippedItemNativeRefreshPending = nil\n        itemFrame.cdmRefreshDataVisualPending = nil\n        itemFrame.cdmLastBuffBorderSpellID = nil\n'''
          assert oldreset in s
          s = s.replace(oldreset, newreset, 1)

          p.write_text(s, encoding='utf-8')

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate full addon
        run: |
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)
          s = Path('KCDM/Core/Style.lua').read_text()
          assert 'Remaining file content unchanged' not in s
          assert 'ApplyNativeAuraCooldown' not in s
          assert 'hooksecurefunc(frame, "RefreshData"' in s
          assert 'if frame.cdmInternalWrite then return end' in s
          assert 'if isEquippedItem and entry and entry.auraOverlay then' in s
          PY

      - name: Commit repaired fix
        run: |
          git config user.name 'Tronicolol'
          git config user.email '54152736+Tronicolol@users.noreply.github.com'
          git add KCDM/Core/Style.lua
          git commit -m 'Let Blizzard own equipped item aura timeline [skip ci]'
          git push origin HEAD:arreglos-visuales

      - name: Build complete addon package
        run: |
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options

      - uses: actions/upload-artifact@v4
        with:
          name: Ayije-Complete-Equipped-Aura-Native-Fix
          path: package/
          if-no-files-found: error
