name: Validate aura overlay runtime fix

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arreglos-visuales
          fetch-depth: 0

      - name: Apply aura overlay runtime fix
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('KCDM/Core/Style.lua')
          text = p.read_text(encoding='utf-8')

          pattern = re.compile(r'local function IsNativeAuraActive\(frame\).*?\nend\n\nlocal function GetEquippedItemRealCooldown', re.S)
          replacement = '''local function IsNativeAuraActive(frame)\n    return frame and frame.cooldownUseAuraDisplayTime == true or false\nend\n\nlocal function GetEquippedItemRealCooldown'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'IsNativeAuraActive replacement: expected 1, found {count}')

          marker = 'local function HasChargeSource(frame)'
          if marker not in text:
              raise SystemExit('HasChargeSource marker missing')

          helper = '''local function ApplyNativeAuraCooldown(frame, cd)\n    if not frame or not cd then return false end\n\n    local startTime = frame.cooldownStartTime\n    local duration = frame.cooldownDuration\n    local enabled = frame.cooldownEnabled\n    local modRate = frame.cooldownModRate\n\n    if startTime == nil or duration == nil then return false end\n    if canaccessvalue and (not canaccessvalue(startTime) or not canaccessvalue(duration)) then return false end\n    if enabled ~= nil and canaccessvalue and not canaccessvalue(enabled) then return false end\n    if modRate ~= nil and canaccessvalue and not canaccessvalue(modRate) then return false end\n\n    if type(startTime) ~= "number" or type(duration) ~= "number" or duration <= 0 then\n        return false\n    end\n\n    cd:SetUseAuraDisplayTime(true)\n    cd:SetDrawSwipe(true)\n\n    if type(CooldownFrame_Set) == "function" then\n        CooldownFrame_Set(cd, startTime, duration, enabled, false, modRate or 1)\n    else\n        cd:SetCooldown(startTime, duration, modRate or 1)\n    end\n\n    return true\nend\n\n'''
          text = text.replace(marker, helper + marker, 1)

          old = '''    local onCooldown = false\n    if entry and entry.auraOverlay then\n        onCooldown = false\n    elseif IsEquippedItemCooldownFrame(frame) then\n'''
          new = '''    local onCooldown = false\n    if entry and entry.auraOverlay and auraActive then\n        onCooldown = false\n    elseif IsEquippedItemCooldownFrame(frame) then\n'''
          if old not in text:
              raise SystemExit('cooldown tint branch missing')
          text = text.replace(old, new, 1)

          old = '''    if entry and entry.auraOverlay and auraActive then\n        cd:SetReverse(true)\n        cd:SetAlpha(1)\n        cd:SetDrawEdge(false)\n        cd:SetUseAuraDisplayTime(true)\n        cd:SetDrawSwipe(true)\n        frame.cdmCooldownOverlayStyleApplied = true\n'''
          new = '''    if entry and entry.auraOverlay and auraActive then\n        cd:SetAlpha(1)\n        cd:SetDrawEdge(false)\n        if IsEquippedItemCooldownFrame(frame) then\n            cd:SetReverse(false)\n            ApplyNativeAuraCooldown(frame, cd)\n        else\n            cd:SetReverse(true)\n            cd:SetUseAuraDisplayTime(true)\n            cd:SetDrawSwipe(true)\n        end\n        frame.cdmCooldownOverlayStyleApplied = true\n'''
          if old not in text:
              raise SystemExit('active overlay branch missing')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate addon
        run: |
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          git diff --check

      - name: Validate invariants
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)

          s = Path('KCDM/Core/Style.lua').read_text(encoding='utf-8')
          required = [
              'return frame and frame.cooldownUseAuraDisplayTime == true or false',
              'local function ApplyNativeAuraCooldown(frame, cd)',
              'CooldownFrame_Set(cd, startTime, duration, enabled, false, modRate or 1)',
              'if entry and entry.auraOverlay and auraActive then',
              'elseif IsEquippedItemCooldownFrame(frame) then',
          ]
          for token in required:
              assert token in s, token

      - name: Commit fix
        run: |
          git config user.name 'Tronicolol'
          git config user.email '54152736+Tronicolol@users.noreply.github.com'
          git add KCDM/Core/Style.lua
          git commit -m 'Restore equipped item aura timer and state [skip ci]'
          git push origin HEAD:arreglos-visuales

      - name: Build complete addon package
        run: |
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options

      - uses: actions/upload-artifact@v4
        with:
          name: Ayije-Complete-Aura-Overlay-Runtime-Fix
          path: package/
          if-no-files-found: error
