name: Validate equipped item cooldown fix

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arreglos-visuales
          fetch-depth: 0

      - name: Apply equipped item cooldown ownership fix
        shell: python
        run: |
          from pathlib import Path

          p = Path('KCDM/Core/Style.lua')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''local function GetCastSpellID(frame)\n    if not frame then return nil end\n    local info = frame.cooldownInfo\n    if not info then return nil end\n    local id = info.overrideSpellID or info.spellID\n    return IsSafeNumber(id) and id or nil\nend\nCDM.GetCastSpellID = GetCastSpellID\n\nlocal function HasChargeSource(frame)\n''',
              '''local function GetCastSpellID(frame)\n    if not frame then return nil end\n    local info = frame.cooldownInfo\n    if not info then return nil end\n    local id = info.overrideSpellID or info.spellID\n    return IsSafeNumber(id) and id or nil\nend\nCDM.GetCastSpellID = GetCastSpellID\n\nlocal function IsEquippedItemCooldownFrame(frame)\n    if not frame or type(frame.GetEquipSlot) ~= "function" then return false end\n    local ok, equipSlot = pcall(frame.GetEquipSlot, frame)\n    return ok and IsSafeNumber(equipSlot) and equipSlot > 0\nend\n\nlocal function HasChargeSource(frame)\n''',
              'equipped item helper'
          )

          replace_once(
              '''    if entry and entry.auraOverlay then\n        onCooldown = false\n    elseif sid then\n        local chargeInfo = GetSpellCharges(sid)\n''',
              '''    if entry and entry.auraOverlay then\n        onCooldown = false\n    elseif IsEquippedItemCooldownFrame(frame) then\n        local itemCooldownState = fallbackCooldownState\n        if itemCooldownState == nil then itemCooldownState = frame.cooldownDesaturated end\n        if itemCooldownState ~= nil and canaccessvalue(itemCooldownState) then\n            onCooldown = itemCooldownState == true\n        end\n    elseif sid then\n        local chargeInfo = GetSpellCharges(sid)\n''',
              'equipped item cooldown tint state'
          )

          replace_once(
              '''    if entry and entry.auraOverlay and auraActive then\n        desat = 0\n    elseif entry and entry.auraOverlay and entry.auraDesaturateInactive then\n        desat = 1\n    elseif sid and not HasChargeSource(frame) then\n''',
              '''    if entry and entry.auraOverlay and auraActive then\n        desat = 0\n    elseif entry and entry.auraOverlay and entry.auraDesaturateInactive then\n        desat = 1\n    elseif IsEquippedItemCooldownFrame(frame) then\n        local boolDesat = blizzDesat\n        if boolDesat == nil then boolDesat = frame.cooldownDesaturated end\n        if boolDesat ~= nil and canaccessvalue(boolDesat) and not styleCache.disableCooldownDesat then\n            desat = EvaluateColorValueFromBoolean(boolDesat, 1, 0)\n        end\n    elseif sid and not HasChargeSource(frame) then\n''',
              'equipped item desaturation ownership'
          )

          replace_once(
              '''        if HasChargeSource(frame) then\n            local chargeDur = sid and GetSpellChargeDuration(sid)\n''',
              '''        if IsEquippedItemCooldownFrame(frame) then\n            -- Blizzard has dedicated equipped-item cooldown logic (including\n            -- suppression of shared item/GCD categories). Keep its timer intact.\n            cd:SetDrawEdge(false)\n        elseif HasChargeSource(frame) then\n            local chargeDur = sid and GetSpellChargeDuration(sid)\n''',
              'preserve blizzard equipped item cooldown timer'
          )

          replace_once(
              '''                    if styleCache.hideGCDSwipe then\n                        local sid = GetCastSpellID(frame)\n                        local realDur = sid and GetSpellCooldownDuration(sid, true)\n                        if realDur then\n                            cd:SetCooldownFromDurationObject(realDur)\n                        end\n                    end\n''',
              '''                    if styleCache.hideGCDSwipe and not IsEquippedItemCooldownFrame(frame) then\n                        local sid = GetCastSpellID(frame)\n                        local realDur = sid and GetSpellCooldownDuration(sid, true)\n                        if realDur then\n                            cd:SetCooldownFromDurationObject(realDur)\n                        end\n                    end\n''',
              'skip spell cooldown rewrite for equipped items'
          )

          p.write_text(text, encoding='utf-8')

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate addon
        run: |
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          git diff --check

      - name: Validate invariants
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)

          s = Path('KCDM/Core/Style.lua').read_text(encoding='utf-8')
          required = [
              'local function IsEquippedItemCooldownFrame(frame)',
              'elseif IsEquippedItemCooldownFrame(frame) then',
              'styleCache.hideGCDSwipe and not IsEquippedItemCooldownFrame(frame)',
              'Blizzard has dedicated equipped-item cooldown logic',
          ]
          for token in required:
              assert token in s, token

      - name: Commit fix
        run: |
          git config user.name 'Tronicolol'
          git config user.email '54152736+Tronicolol@users.noreply.github.com'
          git add KCDM/Core/Style.lua
          git commit -m 'Preserve Blizzard cooldowns for equipped CDM items [skip ci]'
          git push origin HEAD:arreglos-visuales

      - name: Build complete addon package
        run: |
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options

      - uses: actions/upload-artifact@v4
        with:
          name: Ayije-Complete-Equipped-Item-Cooldown-Fix
          path: package/
          if-no-files-found: error
