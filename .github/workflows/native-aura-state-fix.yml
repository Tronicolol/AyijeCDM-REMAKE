name: Validate native aura state fix

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arreglos-visuales
          fetch-depth: 0

      - name: Apply native aura state fix
        shell: python
        run: |
          from pathlib import Path

          p = Path('KCDM/Core/Style.lua')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''local function IsEquippedItemCooldownFrame(frame)\n    return GetEquippedItemSlot(frame) ~= nil\nend\n\nlocal function GetEquippedItemRealCooldown(frame)\n''',
              '''local function IsEquippedItemCooldownFrame(frame)\n    return GetEquippedItemSlot(frame) ~= nil\nend\n\nlocal function IsNativeAuraActive(frame)\n    if not frame then return false end\n    if frame.cooldownUseAuraDisplayTime == true then return true end\n    if type(frame.GetAuraSpellID) ~= "function" then return false end\n\n    local ok, auraSpellID = pcall(frame.GetAuraSpellID, frame)\n    return ok and IsSafeNumber(auraSpellID) and auraSpellID > 0\nend\n\nlocal function GetEquippedItemRealCooldown(frame)\n''',
              'native aura helper'
          )

          replace_once(
              '''    local entry = FindAuraOverlayEntry(frame)\n    local blizzardAuraActive = (frame.cooldownUseAuraDisplayTime == true)\n    local auraActive = entry and entry.auraOverlay == true and blizzardAuraActive or false\n''',
              '''    local entry = FindAuraOverlayEntry(frame)\n    local nativeAuraActive = IsNativeAuraActive(frame)\n    local auraActive = entry and entry.auraOverlay == true and nativeAuraActive or false\n''',
              'refresh visuals aura state'
          )

          replace_once(
              '''                    local entry = FindAuraOverlayEntry(frame)\n                    local auraActive = (frame.cooldownUseAuraDisplayTime == true)\n                    ApplyIconDesat(frame, entry, auraActive, GetCastSpellID(frame), desaturated)\n''',
              '''                    local entry = FindAuraOverlayEntry(frame)\n                    local auraActive = entry and entry.auraOverlay == true and IsNativeAuraActive(frame) or false\n                    ApplyIconDesat(frame, entry, auraActive, GetCastSpellID(frame), desaturated)\n''',
              'desat hook aura state'
          )

          replace_once(
              '''                    local entry = FindAuraOverlayEntry(frame)\n                    local auraActive = (frame.cooldownUseAuraDisplayTime == true)\n                    ApplyCooldownIconAppearance(frame, entry, auraActive, GetCastSpellID(frame))\n''',
              '''                    local entry = FindAuraOverlayEntry(frame)\n                    local auraActive = entry and entry.auraOverlay == true and IsNativeAuraActive(frame) or false\n                    ApplyCooldownIconAppearance(frame, entry, auraActive, GetCastSpellID(frame))\n''',
              'appearance hook aura state'
          )

          replace_once(
              '''                       or frame.cooldownUseAuraDisplayTime == true\n''',
              '''                       or IsNativeAuraActive(frame)\n''',
              'cooldown hook native aura condition'
          )

          p.write_text(text, encoding='utf-8')

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate complete addon
        run: |
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          git diff --check

      - name: Validate XML and invariants
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)

          s = Path('KCDM/Core/Style.lua').read_text(encoding='utf-8')
          required = [
              'local function IsNativeAuraActive(frame)',
              'local nativeAuraActive = IsNativeAuraActive(frame)',
              'entry and entry.auraOverlay == true and IsNativeAuraActive(frame) or false',
              'or IsNativeAuraActive(frame)',
          ]
          for token in required:
              assert token in s, token

          assert s.count('frame.cooldownUseAuraDisplayTime == true') == 1, 'raw aura flag should only remain inside IsNativeAuraActive'

      - name: Commit fix
        run: |
          git config user.name 'Tronicolol'
          git config user.email '54152736+Tronicolol@users.noreply.github.com'
          git add KCDM/Core/Style.lua
          git commit -m 'Use native aura identity for overlay state [skip ci]'
          git push origin HEAD:arreglos-visuales

      - name: Build complete addon package
        run: |
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options

      - uses: actions/upload-artifact@v4
        with:
          name: Ayije-Complete-Native-Aura-State-Fix
          path: package/
          if-no-files-found: error
