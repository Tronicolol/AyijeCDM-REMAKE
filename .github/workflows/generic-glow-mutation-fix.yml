name: Validate current generic glow controller

on:
  push:
    branches:
      - arreglos-visuales

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arreglos-visuales
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate complete addon
        run: |
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          git diff --check

      - name: Validate XML and glow invariants
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)

          c = Path('KCDM/Modules/GlowController.lua').read_text(encoding='utf-8')
          required = [
              'local layoutMutationSuspended = false',
              'local LAYOUT_SETTLE_DELAY = 0.12',
              'local function BeginLayoutMutation()',
              'BeginLayoutMutation()',
              'local function FinishLayoutMutation(generation)',
              'LCG.ButtonGlow_Stop(host)',
              'if IsPrimaryGlowSuspended() then return end',
          ]
          for token in required:
              assert token in c, token

          assert 'ButtonGlowPool:Release' not in c
          assert 'pool:Release' not in c

      - name: Build complete addon package
        run: |
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options

      - uses: actions/upload-artifact@v4
        with:
          name: Ayije-Complete-Generic-Glow-Fix
          path: package/
          if-no-files-found: error
