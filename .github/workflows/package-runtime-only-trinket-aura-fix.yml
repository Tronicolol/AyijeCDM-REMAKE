name: Package runtime-only trinket aura fix

on:
  push:
    branches:
      - fix-trinket-aura-overlay-glow

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-trinket-aura-overlay-glow
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate final branch state
        run: |
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          git diff --check origin/main...HEAD
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)

          files = set(subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines())
          files.discard('.github/workflows/package-runtime-only-trinket-aura-fix.yml')
          expected = {
              'KCDM/Core/SpellUtils.lua',
              'KCDM/Core/Style.lua',
              'KCDM/Core/GlowDirector.lua',
          }
          assert files == expected, (files, expected)

          assert not Path('KCDM/Modules/TrinketAuraMapDebug.lua').exists()
          assert 'TrinketAuraMapDebug.lua' not in Path('KCDM/Modules/embeds.xml').read_text(encoding='utf-8')
          PY

      - name: Build complete addon package
        run: |
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options

      - name: Verify package roots
        shell: python
        run: |
          from pathlib import Path
          roots = sorted(p.name for p in Path('package').iterdir())
          assert roots == ['KCDM', 'KCDM_Options'], roots
          assert Path('package/KCDM/KCDM.toc').is_file()
          assert Path('package/KCDM_Options/KCDM_Options.toc').is_file()

      - uses: actions/upload-artifact@v4
        with:
          name: KCDM-Runtime-Only-Trinket-Aura-Glow-Fix
          path: package/
          if-no-files-found: error
