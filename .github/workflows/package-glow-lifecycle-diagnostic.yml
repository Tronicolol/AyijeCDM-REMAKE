name: Package glow lifecycle diagnostic

on:
  push:
    branches:
      - fix-glow-lifecycle-stability

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-glow-lifecycle-stability
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Validate diagnostic diff
        run: |
          find KCDM KCDM_Options -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          git diff --check origin/main...HEAD
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          for root in (Path('KCDM'), Path('KCDM_Options')):
              for xml in root.rglob('*.xml'):
                  ET.parse(xml)

          files = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              text=True
          ).splitlines())
          files.discard('.github/workflows/package-glow-lifecycle-diagnostic.yml')
          expected = {
              'KCDM/Modules/GlowController.lua',
              'KCDM/Modules/GlowLifecycleDebug.lua',
              'KCDM/Modules/embeds.xml',
          }
          assert files == expected, (files, expected)

          controller = Path('KCDM/Modules/GlowController.lua').read_text(encoding='utf-8')
          debug = Path('KCDM/Modules/GlowLifecycleDebug.lua').read_text(encoding='utf-8')
          embeds = Path('KCDM/Modules/embeds.xml').read_text(encoding='utf-8')

          assert 'DebugTrace("SIZE", self, width, height)' in controller
          assert 'DebugTrace("LCG_START"' in controller
          assert 'DebugTrace("APPLY"' in controller
          assert 'DebugTrace("REQUEST"' in controller
          assert 'CDM.GlowLifecycleTrace = Record' in debug
          assert 'SLASH_KCDMGLOWDIAG1 = "/kcdmglowdiag"' in debug
          assert '<Script file="GlowController.lua"/>' in embeds
          assert '<Script file="GlowLifecycleDebug.lua"/>' in embeds
          assert embeds.index('GlowController.lua') < embeds.index('GlowLifecycleDebug.lua')
          PY

      - name: Build complete addon package
        run: |
          mkdir package
          cp -a KCDM package/KCDM
          cp -a KCDM_Options package/KCDM_Options

      - name: Verify package roots
        shell: python
        run: |
          from pathlib import Path
          roots = sorted(p.name for p in Path('package').iterdir())
          assert roots == ['KCDM', 'KCDM_Options'], roots
          assert Path('package/KCDM/KCDM.toc').is_file()
          assert Path('package/KCDM_Options/KCDM_Options.toc').is_file()
          assert Path('package/KCDM/Modules/GlowLifecycleDebug.lua').is_file()

      - uses: actions/upload-artifact@v4
        with:
          name: KCDM-Glow-Lifecycle-Diagnostic
          path: package/
          if-no-files-found: error
